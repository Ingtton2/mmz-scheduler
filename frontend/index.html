<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>memeal.zip — 근태관리</title>
    <link rel="icon" type="image/png" href="/logo.png" />

    <!-- PWA (관리자용 기본값 — 화면 이동에 따라 src/pwa.ts 가 계속 맞춰 바꿈) -->
    <link rel="manifest" href="/manifest-admin.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/admin-180.png" />
    <meta name="theme-color" content="#B08968" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="메밀집 관리자" />

    <!-- 전체 폰트: Pretendard -->
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />

    <!-- 카카오톡 등 메신저에 링크 공유했을 때 뜨는 미리보기 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="메밀집 스케쥴관리" />
    <meta
      property="og:description"
      content="직원 근무 스케줄을 자동으로 짜고 바로 공개하는 근태관리 서비스예요."
    />
    <meta property="og:image" content="https://mmz-scheduler.vercel.app/logo_admin.png" />
    <meta property="og:url" content="https://mmz-scheduler.vercel.app" />
  </head>
  <body>
    <!-- React 화면이 이 div 안에 그려집니다. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
